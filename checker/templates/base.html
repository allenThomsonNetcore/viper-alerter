<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2c">
  <title>{% block title %}Viper · Indexing Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viper.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Viper dashboard home">
      <span class="brand-mark">V</span><span>Viper<span class="brand-muted"> / Indexing monitor</span></span>
    </a>
    {% if session.get('viper_authenticated') %}
    <nav class="topnav" aria-label="Main navigation">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Alerts</a>
      <a href="/live-status" class="{% if request.path == '/live-status' %}active{% endif %}">Live feed status</a>
    </nav>
    <form action="{{ url_for('logout') }}" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="button button-quiet" type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>
  {% block content %}{% endblock %}
  <script>
    (() => {
      const formatter = new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'medium'
      });
      document.querySelectorAll('.ist-time').forEach(el => {
        const date = new Date(el.dataset.utc);
        if (!Number.isNaN(date.getTime())) {
          el.textContent = formatter.format(date) + ' IST';
          el.title = date.toISOString() + ' UTC';
        }
      });
    })();
  </script>
</body>
</html>
