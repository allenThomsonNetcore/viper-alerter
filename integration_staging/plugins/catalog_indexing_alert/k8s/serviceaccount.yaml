apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-indexing-alert
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-indexing-alert-state
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["catalog-indexing-alert-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-indexing-alert-state
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: catalog-indexing-alert
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-indexing-alert-state
