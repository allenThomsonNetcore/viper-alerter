apiVersion: v1
kind: ServiceAccount
metadata:
  name: viper-alerter
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viper-alerter-state
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["viper-alerter-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viper-alerter-state
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: viper-alerter
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: viper-alerter-state
