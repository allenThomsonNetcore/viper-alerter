apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: indexing-alert-state
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["indexing-alert-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: indexing-alert-state
  namespace: default
subjects:
  - kind: ServiceAccount
    name: indexing-alert
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: indexing-alert-state
