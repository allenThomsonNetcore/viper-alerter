services:
  - type: web
    name: viper-alerter
    runtime: python
    plan: free
    branch: feat_service_method
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 checker.web:app
    healthCheckPath: /healthz
    envVars:
      - key: SITE_CSV_PATH
        value: sites.example.csv
      - key: CONFIG_YAML
        value: config.yaml
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RUN_TRIGGER_TOKEN
        generateValue: true
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_TO_EMAIL
        sync: false
      - key: EMAILJS_CC_EMAILS
        sync: false
      - key: EMAILJS_BCC_EMAILS
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: BUFFER_MINUTES
        value: "15"
      - key: MAX_WORKERS
        value: "10"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: TIMESTAMP_SEMANTICS
        value: finish
